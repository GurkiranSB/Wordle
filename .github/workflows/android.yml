name: Android

on:
  push:
    branches:
      - feature/android-app
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Run tests and build debug APK and signed release bundle
        working-directory: android
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/ci-only-upload-key.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE_PATH" \
            -storetype JKS \
            -storepass ci-only-store-password \
            -keypass ci-only-key-password \
            -alias ci-only-upload \
            -dname "CN=Temporary CI Signing Key" \
            -keyalg RSA -keysize 2048 -validity 2
          export ANDROID_KEYSTORE_PATH="$KEYSTORE_PATH"
          export ANDROID_KEYSTORE_PASSWORD=ci-only-store-password
          export ANDROID_KEY_ALIAS=ci-only-upload
          export ANDROID_KEY_PASSWORD=ci-only-key-password
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wordle-coach-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
